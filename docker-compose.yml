services:
  embarcadino:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - searxng
    environment:
      - TELEGRAM_TOKEN_BASE64=${TELEGRAM_TOKEN_BASE64}
      - ADMIN_CHAT_IDS=${ADMIN_CHAT_IDS}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY_BASE64=${LLM_API_KEY_BASE64}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_WRITER_MODEL=${LLM_WRITER_MODEL:-}
      - LLM_APP_URL=${LLM_APP_URL:-}
      - LLM_APP_NAME=${LLM_APP_NAME:-}
      - BLOG_BASE_URL=${BLOG_BASE_URL:-https://cienciaembarcada.com.br}
      - WORDPRESS_USERNAME=${WORDPRESS_USERNAME:-}
      - WORDPRESS_APP_PASSWORD_BASE64=${WORDPRESS_APP_PASSWORD_BASE64:-}
      # Aponta para o SearXNG deste mesmo compose, pela rede interna.
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
    healthcheck:
      test: ["CMD", "pgrep", "-x", "node"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    # Sem `ports`: a instância só é alcançável de dentro da rede do Compose.
    # Publicar a porta transformaria isso num metabuscador aberto na internet.
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-embarcadino-searxng-secret-key}
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
