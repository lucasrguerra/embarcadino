# Configuração do SearXNG usado pelo Embarcadino.
#
# Esta instância é interna: só o container do bot fala com ela, pela rede do
# Compose. Por isso o formato JSON está habilitado (o cliente de pesquisa
# depende dele) e o limiter está desligado — o limiter existe pra barrar
# scraping vindo da internet, e aqui não há porta publicada.
#
# Se um dia esta instância for exposta publicamente, ligue o limiter de volta
# e mantenha o JSON restrito, senão ela vira um proxy de busca aberto.
#
# NÃO É DEFEITO: no boot aparece uma vez a linha
#   ERROR:searx.botdetection: X-Forwarded-For nor X-Real-IP header is set!
# Ela vem de um middleware WSGI que roda mesmo com o limiter desligado e só
# constata que ninguém está atrás de um proxy reverso — que é exatamente o caso
# aqui. É logada uma única vez por worker e não afeta busca nenhuma.

# `remove` é o único jeito de o engine não ser carregado: `disabled: true` só o
# esconde da busca, o SearXNG ainda importa o módulo e roda o init dele — e é
# justamente no init que estes três estouram a cada boot:
#   - ahmia e torch indexam .onion e exigem um proxy Tor que este container não
#     tem ("can't register engine");
#   - wikidata inicializa baixando as propriedades do query.wikidata.org, que
#     responde 403 para IP de datacenter, e o erro vira stack trace no log.
# Nenhum dos três contribui com resultado técnico para o que o bot pesquisa.
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - wikidata

general:
  instance_name: 'Embarcadino Search'
  # Sem página de doação e sem métricas — instância de serviço, não de uso humano.
  donation_url: false
  enable_metrics: false

server:
  # Trocado em tempo de execução pela variável SEARXNG_SECRET do .env.
  secret_key: 'troque-esta-chave-no-env'
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # O 'json' é obrigatório: é o formato que o ResearchClient consome.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ''
  # 'all' de propósito. Com 'pt-BR' a busca só devolvia página em português, e a
  # fonte primária do que o bot pesquisa — datasheet, ESP-IDF, RFC, aviso de
  # fabricante — é em inglês. Medido na mesma query: 10 resultados com 'pt-BR',
  # 28 com 'all', e só com 'all' aparece a documentação oficial do Espressif.
  # O cliente também manda language=all em cada requisição.
  default_lang: 'all'

ui:
  # Com hífen: o SearXNG valida contra LOCALE_NAMES, onde a chave é 'pt-BR'.
  # 'pt_BR' (com underscore) é o nome do diretório de tradução e derruba o
  # processo no boot com ValidationException.
  default_locale: 'pt-BR'

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

# O bing voltou: com só google+duckduckgo respondendo, a cobertura ficava
# estreita demais para busca técnica, e resultado escasso é o que leva o modelo
# a inventar URL. Medido nesta instância, para "esp32 task watchdog timer
# configuration", o bing devolve 10 resultados com a documentação oficial do
# Espressif entre eles.
#
# O brave foi testado e reprovou EM PRODUÇÃO: da máquina de desenvolvimento ele
# respondia bem, mas do IP do servidor devolve 429 e o SearXNG o suspende por
# 180s a cada busca ("SearxEngineTooManyRequestsException"). Ele não contribui
# com resultado nenhum lá e só enche o log de stack trace.
#
# O startpage está desligado porque responde com erro nesta instância (o
# endpoint JSON devolve uma lista no lugar do objeto de resultados).
engines:
  - name: startpage
    disabled: true
  - name: brave
    disabled: true
